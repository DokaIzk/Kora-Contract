name: Good First Issue Curation

# Keeps the `good first issue` pipeline from silently going stale (see
# docs/GOOD_FIRST_ISSUES.md). Flags issues with no recent activity, flags
# stale assignee claims, and flags an empty open pipeline, by upserting a
# single tracking issue — same pattern as dependency-advisories.yml.

on:
  schedule:
    - cron: "0 8 * * 1" # Weekly, Monday 08:00 UTC
  workflow_dispatch:
    inputs:
      simulate_finding:
        description: "Test issue creation without real stale/empty findings"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

jobs:
  curate:
    name: Check good-first-issue pipeline health
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate good-first-issue pipeline
        uses: actions/github-script@v7
        env:
          SIMULATE: ${{ inputs.simulate_finding }}
        with:
          script: |
            const STALE_DAYS = 45;
            const staleCutoff = Date.now() - STALE_DAYS * 24 * 60 * 60 * 1000;
            const { owner, repo } = context.repo;
            const simulated = process.env.SIMULATE === "true";

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "good first issue",
              per_page: 100,
            });
            const realIssues = issues.filter((i) => !i.pull_request);

            const staleUnassigned = [];
            const staleAssigned = [];

            for (const issue of realIssues) {
              // Last activity: prefer the issue's own updated_at (covers label
              // changes, edits, and comments — GitHub bumps it for all three).
              const lastActivity = new Date(issue.updated_at).getTime();
              if (lastActivity > staleCutoff) continue;

              if (issue.assignees && issue.assignees.length > 0) {
                staleAssigned.push(issue);
              } else {
                staleUnassigned.push(issue);
              }
            }

            const emptyPipeline = realIssues.filter((i) => !i.assignees || i.assignees.length === 0).length === 0;

            const hasFindings = staleUnassigned.length > 0 || staleAssigned.length > 0 || emptyPipeline;
            if (!hasFindings && !simulated) {
              console.log(`OK — ${realIssues.length} open good-first-issue(s), none stale, pipeline not empty.`);
              return;
            }

            const title = simulated
              ? "[Curation Test] Good first issue curation delivery check"
              : "Good First Issue Curation: Needs Review";

            const lines = [];
            if (simulated) {
              lines.push(
                "This is a simulated test run (`workflow_dispatch` with `simulate_finding: true`). " +
                "No real staleness or empty-pipeline condition was necessarily found. Close this issue " +
                "after confirming the notification path works."
              );
              lines.push("");
            }

            if (emptyPipeline) {
              lines.push(
                "**Pipeline is empty:** there are no open, unassigned `good first issue`s right now. " +
                "See `docs/GOOD_FIRST_ISSUES.md` § Where Candidates Come From for curation sources."
              );
              lines.push("");
            }

            if (staleUnassigned.length > 0) {
              lines.push(`**Unassigned, no activity in ${STALE_DAYS}+ days** (re-confirm scope is still accurate):`);
              for (const i of staleUnassigned) {
                lines.push(`- #${i.number} ${i.title} (updated ${i.updated_at.slice(0, 10)})`);
              }
              lines.push("");
            }

            if (staleAssigned.length > 0) {
              lines.push(`**Assigned, no activity in ${STALE_DAYS}+ days** (likely dropped claim — consider unassigning):`);
              for (const i of staleAssigned) {
                const who = i.assignees.map((a) => `@${a.login}`).join(", ");
                lines.push(`- #${i.number} ${i.title} — assigned to ${who} (updated ${i.updated_at.slice(0, 10)})`);
              }
              lines.push("");
            }

            lines.push(`Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`);
            const body = lines.join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const tracking = existing.data.find((item) => item.title === title && !item.pull_request);
            if (tracking) {
              await github.rest.issues.createComment({ owner, repo, issue_number: tracking.number, body });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
            }
