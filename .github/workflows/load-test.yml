name: Load Tests

# =============================================================================
# Kora Protocol — Load Testing Harness
#
# Runs realistic traffic scenarios against the staging environment.
#
# SAFETY: Never runs against production. The K6_BASE_URL is validated to
# contain "staging" before any load is sent.
#
# Triggers:
#   - Weekly schedule: Sundays 02:00 UTC (low-traffic window)
#   - Manual: workflow_dispatch
#   - Automatically on pull requests that touch infra/**
# =============================================================================

on:
  schedule:
    - cron: "0 2 * * 0"   # Sundays 02:00 UTC
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run (browsing-burst | funding-spike | subscription-fanout | combined)"
        required: false
        default: "combined"
      base_url:
        description: "Staging base URL (must contain 'staging')"
        required: false
        default: "https://staging-api.kora.finance"
  pull_request:
    paths:
      - "infra/**"
      - "services/api/**"

jobs:
  load-test:
    name: Load Test (${{ github.event.inputs.scenario || 'combined' }})
    runs-on: ubuntu-latest

    # Only run PR-triggered tests if infra files changed; always run scheduled/manual
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(join(github.event.pull_request.changed_files.*.filename, ','), 'infra/'))

    env:
      K6_BASE_URL: ${{ github.event.inputs.base_url || 'https://staging-api.kora.finance' }}
      K6_API_KEY:  ${{ secrets.STAGING_API_KEY }}
      SCENARIO:    ${{ github.event.inputs.scenario || 'combined' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target is not production
        run: |
          if [[ "$K6_BASE_URL" != *"staging"* && "$K6_BASE_URL" != *"localhost"* ]]; then
            echo "ERROR: K6_BASE_URL must be a staging URL. Got: $K6_BASE_URL"
            echo "Load tests must NEVER run against production."
            exit 1
          fi
          echo "Target: $K6_BASE_URL"

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Install Node.js (for report generation)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create results directory
        run: mkdir -p infra/load-testing/results

      - name: Run load test scenario
        id: load_test
        run: |
          SCENARIO_FILE="infra/load-testing/scenarios/${SCENARIO}.js"
          RESULTS_FILE="infra/load-testing/results/${SCENARIO}-$(date +%Y%m%d-%H%M%S).json"

          echo "Running scenario: $SCENARIO"
          echo "Output file: $RESULTS_FILE"

          k6 run \
            --out "json=${RESULTS_FILE}" \
            --summary-trend-stats "p(90),p(95),p(99),avg,max" \
            "$SCENARIO_FILE"

          echo "results_file=${RESULTS_FILE}" >> "$GITHUB_OUTPUT"

      - name: Generate actionable report
        if: always()
        run: |
          RESULTS_FILE="${{ steps.load_test.outputs.results_file }}"
          REPORT_FILE="infra/load-testing/results/report-${SCENARIO}-$(date +%Y%m%d-%H%M%S).txt"

          if [ -f "$RESULTS_FILE" ]; then
            node infra/load-testing/scripts/report.js "$RESULTS_FILE" --output "$REPORT_FILE"
          else
            echo "Results file not found: $RESULTS_FILE" > "$REPORT_FILE"
          fi

          echo "=== Load Test Report ===" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          cat "$REPORT_FILE" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ github.run_number }}
          path: infra/load-testing/results/
          retention-days: 90

      - name: Fail job if load test failed
        if: steps.load_test.outcome == 'failure'
        run: |
          echo "Load test FAILED — threshold(s) breached."
          echo "See the report above for bottleneck attribution."
          echo "Do not merge infra changes that fail this gate."
          exit 1
