name: Scheduled dependency advisories

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      simulate_finding:
        description: "Test issue creation without a real advisory finding"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: Recheck main dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo deny check
        id: deny
        continue-on-error: true
        run: cargo deny check

      - name: cargo audit
        id: audit
        continue-on-error: true
        run: cargo audit

      - name: Create or update advisory tracking issue
        if: steps.deny.outcome == 'failure' || steps.audit.outcome == 'failure' || inputs.simulate_finding
        uses: actions/github-script@v7
        env:
          DENY_OUTCOME: ${{ steps.deny.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        with:
          script: |
            const simulated = "${{ inputs.simulate_finding }}" === "true";
            const title = simulated
              ? "[Security Test] Scheduled dependency alert delivery"
              : "[Security] Scheduled dependency advisory findings";
            const body = [
              simulated
                ? "This is a simulated alert-delivery test. No dependency advisory was asserted. Close this issue after confirming the notification path."
                : "The scheduled dependency scan found one or more dependency-policy or security-advisory failures on `main`.",
              "",
              `- cargo deny check: **${process.env.DENY_OUTCOME}**`,
              `- cargo audit: **${process.env.AUDIT_OUTCOME}**`,
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Review the advisory, assess transitive dependency reachability, and update the dependency or add a reviewed, time-bounded exception in `deny.toml` if justified."
            ].join("\n");
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });
            const issue = existing.data.find((item) => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body
              });
            }

      - name: Fail scheduled scan when findings exist
        if: steps.deny.outcome == 'failure' || steps.audit.outcome == 'failure'
        run: exit 1