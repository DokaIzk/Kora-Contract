# Active upstream for the API gateway.
# This file is rewritten by deploy.sh on each blue-green swap.
# nginx is sent SIGHUP to reload gracefully without dropping connections.
#
# Default: blue instance on port 3001.
# After first green deploy, this will point to port 3002.

upstream kora_api {
    server 127.0.0.1:3001;
    keepalive 64;
}
