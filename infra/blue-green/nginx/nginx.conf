# =============================================================================
# Kora Protocol — Nginx Configuration (Blue-Green)
#
# Key settings for zero-downtime SSE subscription handling:
#   - proxy_read_timeout: long enough for SSE connections to stay open
#   - proxy_buffering off: required for SSE (streaming responses)
#   - upstream keepalive: reduces connection setup overhead
#   - graceful reload (SIGHUP): in-flight requests complete before upstream switch
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 4096;    # Supports ~4k concurrent SSE connections per worker
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream=$upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 75;

    # ── API Gateway upstream ────────────────────────────────────────────────
    # This file is rewritten by deploy.sh on each colour switch and nginx is
    # sent SIGHUP to reload without dropping connections.
    include /etc/nginx/conf.d/upstream-api.conf;
    include /etc/nginx/conf.d/upstream-indexer.conf;

    server {
        listen 80;
        server_name _;

        # ── Health endpoint (bypasses upstream — always available) ──────────
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # ── Feature flag SSE stream ─────────────────────────────────────────
        # SSE connections must stay open for minutes; disable buffering and
        # set long read timeout. On upstream reload (nginx SIGHUP), existing
        # SSE connections finish their current read cycle then reconnect — the
        # client-side reconnect logic uses the cursor to resume from where it left off.
        location /api/v1/flags/stream {
            proxy_pass         http://kora_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;

            # SSE-specific: disable buffering so events stream immediately
            proxy_buffering    off;
            proxy_cache        off;

            # Keep connection open for up to 10 minutes of inactivity
            proxy_read_timeout 600s;
            proxy_send_timeout 60s;

            # Send a reconnect hint to the client when the upstream reloads
            # The client's EventSource will reconnect automatically.
            add_header X-Accel-Buffering no;
        }

        # ── GraphQL subscriptions (WebSocket) ───────────────────────────────
        location /graphql/subscriptions {
            proxy_pass         http://kora_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;  # 1 hour for long-lived subscriptions
        }

        # ── Indexer GraphQL ─────────────────────────────────────────────────
        location /graphql {
            proxy_pass         http://kora_indexer;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # ── All other API routes ────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://kora_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;

            # Security headers
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header Referrer-Policy strict-origin-when-cross-origin;
        }
    }
}
