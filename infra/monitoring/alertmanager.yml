route:
  receiver: operations-warning
  group_by: ["alertname", "job", "tier"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: on-call-page
      group_wait: 15s
      group_interval: 2m
      repeat_interval: 30m

receivers:
  - name: on-call-page
    webhook_configs:
      - url: http://oncall-router:8080/critical
        send_resolved: true
  - name: operations-warning
    webhook_configs:
      - url: http://oncall-router:8080/warnings
        send_resolved: true